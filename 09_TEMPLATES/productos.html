{% extends "base.html" %}

{% block contenido %}

<h1>📦 PRODUCTOS</h1>

<div class="formulario">

    <h2>➕ AGREGAR PRODUCTO</h2>

    <form
        method="POST"
        action="{{ url_for('producto_crear') }}"
    >

        <div class="grid-form">

            <div>

                <label>
                    Producto
                </label>

                <input
                    type="text"
                    name="nombre"
                    required
                >

            </div>


            <div>

                <label>
                    Precio
                </label>

                <input
                    type="number"
                    step="0.01"
                    name="precio"
                    required
                >

            </div>


            <div>

                <label>
                    Unidad
                </label>

                <select name="unidad">

                    <option value="unidad">
                        Unidad
                    </option>

                    <option value="metro">
                        Metro
                    </option>

                    <option value="kilo">
                        Kilo
                    </option>

                </select>

            </div>

        </div>

        <button class="btn principal">
            GUARDAR PRODUCTO
        </button>

    </form>

</div>


<div class="tabla-contenedor">

    <form
        method="GET"
        class="buscar"
    >

        <input
            type="text"
            name="buscar"
            placeholder="🔍 Buscar producto..."
            value="{{ buscar }}"
        >

        <button class="btn">
            BUSCAR
        </button>

    </form>


    <table>

        <thead>

            <tr>

                <th>PRODUCTO</th>
                <th>PRECIO</th>
                <th>UNIDAD</th>
                <th>ACCIONES</th>

            </tr>

        </thead>


        <tbody>

        {% for p in productos %}

            <tr>

                <form
                    method="POST"
                    action="{{ url_for('producto_editar', producto_id=p.id) }}"
                >

                    <td>

                        <input
                            name="nombre"
                            value="{{ p.nombre }}"
                        >

                    </td>

                    <td>

                        <input
                            type="number"
                            step="0.01"
                            name="precio"
                            value="{{ p.precio }}"
                        >

                    </td>

                    <td>

                        <select name="unidad">

                            <option
                                value="unidad"
                                {% if p.unidad == "unidad" %}
                                selected
                                {% endif %}
                            >
                                Unidad
                            </option>

                            <option
                                value="metro"
                                {% if p.unidad == "metro" %}
                                selected
                                {% endif %}
                            >
                                Metro
                            </option>

                            <option
                                value="kilo"
                                {% if p.unidad == "kilo" %}
                                selected
                                {% endif %}
                            >
                                Kilo
                            </option>

                        </select>

                    </td>

                    <td>

                        <button
                            class="btn pequeño"
                        >
                            💾
                        </button>

                        <a
                            class="btn rojo pequeño"
                            href="{{ url_for('producto_eliminar', producto_id=p.id) }}"
                            onclick="return confirm('¿Eliminar producto?')"
                        >
                            🗑️
                        </a>

                    </td>

                </form>

            </tr>

        {% else %}

            <tr>

                <td colspan="4">
                    No hay productos.
                </td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
