
{% extends "base.html" %}

{% block contenido %}
<style>
.contenedor-cotizacion {
    max-width: 1100px;
    margin: 20px auto;
    padding: 20px;
}
.bloque {
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
}
.campos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
}
.campo {
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.campo input, .campo select, .producto-fila input,
.producto-fila select {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
}
.producto-fila {
    display: grid;
    grid-template-columns: 2fr 0.8fr 1fr 1fr 1fr auto;
    gap: 10px;
    align-items: end;
    padding: 15px 0;
    border-bottom: 1px solid #eee;
}
.boton {
    border: 0;
    border-radius: 7px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: bold;
    margin: 5px 3px;
}
.boton-agregar { background: #e8f0ff; color: #173b79; }
.boton-eliminar { background: #ffe7e7; color: #a40000; }
.boton-guardar { background: #167d45; color: white; }
.total-caja {
    text-align: right;
    font-size: 1.4rem;
    font-weight: bold;
    padding: 20px 0;
}
@media (max-width: 750px) {
    .producto-fila { grid-template-columns: 1fr 1fr; }
    .producto-fila .campo-producto { grid-column: 1 / -1; }
}
</style>

<div class="contenedor-cotizacion">
    <h1>🧾 Crear cotización</h1>

    <form method="POST"
          action="{{ url_for('guardar_cotizacion') }}"
          id="formCotizacion">

        <section class="bloque">
            <h2>Datos del cliente</h2>

            <div class="campos">
                <div class="campo">
                    <label for="cliente">Nombre del cliente *</label>
                    <input type="text" id="cliente" name="cliente"
                           placeholder="Nombre completo" required>
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono"
                           placeholder="Número de teléfono">
                </div>

                <div class="campo">
                    <label for="responsable">Responsable *</label>
                    <select id="responsable" name="responsable" required>
                        <option value="">Seleccionar responsable</option>
                        <option value="José Luis Quenta">José Luis Quenta</option>
                        <option value="Ayudante">Ayudante</option>
                        <option value="Felipa">Felipa</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="bloque">
            <h2>Productos de la cotización</h2>

            <p>
                Escribe libremente el nombre del producto.
                No necesitas registrarlo en un catálogo.
            </p>

            <div id="listaProductos"></div>

            <button type="button" class="boton boton-agregar"
                    id="btnAgregar">
                ➕ Agregar producto
            </button>

            <div class="total-caja">
                Total: <span id="totalVisible">0.00</span> Bs
            </div>

            <input type="hidden" name="items_json" id="items_json">

            <div class="campo">
                <label for="observaciones">Observaciones</label>
                <textarea id="observaciones" name="observaciones"
                          rows="3"
                          placeholder="Observaciones opcionales"></textarea>
            </div>
        </section>

        <button type="submit" class="boton boton-guardar">
            💾 Guardar cotización
        </button>

        <a href="{{ url_for('inicio') }}" class="boton">
            Cancelar
        </a>
    </form>
</div>

<script>
"use strict";

const listaProductos = document.getElementById("listaProductos");
const totalVisible = document.getElementById("totalVisible");
const itemsJson = document.getElementById("items_json");

let productos = [];
let siguienteId = 1;

function nuevoProducto() {
    productos.push({
        id: siguienteId++,
        producto: "",
        cantidad: 1,
        tipo: "normal",
        medida: 1,
        precio: 0
    });

    dibujarProductos();
}

function numeroSeguro(valor) {
    const numero = Number(valor);
    return Number.isFinite(numero) ? numero : 0;
}

function subtotal(producto) {
    const cantidad = numeroSeguro(producto.cantidad);
    const medida = numeroSeguro(producto.medida);
    const precio = numeroSeguro(producto.precio);

    if (producto.tipo === "metros" || producto.tipo === "kilos") {
        return cantidad * medida * precio;
    }

    return cantidad * precio;
}

function dinero(valor) {
    return numeroSeguro(valor).toFixed(2);
}

function escaparHTML(texto) {
    return String(texto).replace(/[&<>"']/g, caracter => {
        const entidades = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        };
        return entidades[caracter];
    });
}

function dibujarProductos() {
    listaProductos.innerHTML = "";

    productos.forEach(producto => {
        const fila = document.createElement("div");
        fila.className = "producto-fila";
        fila.dataset.id = producto.id;

        fila.innerHTML = `
            <div class="campo campo-producto">
                <label>Producto *</label>
                <input type="text"
                       data-campo="producto"
                       value="${escaparHTML(producto.producto)}"
                       placeholder="Ej. Calamina trapezoidal"
                       required>
            </div>

            <div class="campo">
                <label>Cantidad *</label>
                <input type="number"
                       data-campo="cantidad"
                       min="0.01" step="any"
                       value="${producto.cantidad}" required>
            </div>

            <div class="campo">
                <label>Tipo de cálculo</label>
                <select data-campo="tipo">
                    <option value="normal"
                        ${producto.tipo === "normal" ? "selected" : ""}>
                        Normal
                    </option>
                    <option value="metros"
                        ${producto.tipo === "metros" ? "selected" : ""}>
                        Por metros
                    </option>
                    <option value="kilos"
                        ${producto.tipo === "kilos" ? "selected" : ""}>
                        Por kilos
                    </option>
                </select>
            </div>

            <div class="campo">
                <label>
                    ${producto.tipo === "metros" ? "Metros por unidad" :
                      producto.tipo === "kilos" ? "Kilos por unidad" :
                      "Medida"}
                </label>
                <input type="number"
                       data-campo="medida"
                       min="0.01" step="any"
                       value="${producto.medida}"
                       ${producto.tipo === "normal" ? "disabled" : ""}>
            </div>

            <div class="campo">
                <label>
                    Precio ${producto.tipo === "normal" ? "unitario" :
                    producto.tipo === "metros" ? "por metro" : "por kilo"}
                    (Bs) *
                </label>
                <input type="number"
                       data-campo="precio"
                       min="0" step="any"
                       value="${producto.precio}" required>
                <small>Subtotal: <span class="subtotal">${dinero(subtotal(producto))}</span> Bs</small>
            </div>

            <button type="button"
                    class="boton boton-eliminar"
                    data-eliminar="${producto.id}">
                🗑️
            </button>
        `;

        listaProductos.appendChild(fila);
    });

    actualizarTotales();
}

function actualizarTotales() {
    let total = 0;

    productos.forEach(producto => {
        const importe = subtotal(producto);
        total += importe;

        const fila = listaProductos.querySelector(
            '[data-id="' + producto.id + '"]'
        );

        if (fila) {
            const etiqueta = fila.querySelector(".subtotal");
            if (etiqueta) etiqueta.textContent = dinero(importe);
        }
    });

    totalVisible.textContent = dinero(total);

    itemsJson.value = JSON.stringify(
        productos.map(({id, ...producto}) => producto)
    );
}

listaProductos.addEventListener("input", evento => {
    const campo = evento.target.dataset.campo;
    if (!campo) return;

    const fila = evento.target.closest(".producto-fila");
    if (!fila) return;

    const id = Number(fila.dataset.id);
    const producto = productos.find(p => p.id === id);
    if (!producto) return;

    if (campo === "producto" || campo === "tipo") {
        producto[campo] = evento.target.value;
    } else {
        producto[campo] = numeroSeguro(evento.target.value);
    }

    actualizarTotales();
});

listaProductos.addEventListener("change", evento => {
    if (evento.target.dataset.campo === "tipo") {
        const fila = evento.target.closest(".producto-fila");
        const id = Number(fila.dataset.id);
        const producto = productos.find(p => p.id === id);

        if (producto) {
            producto.tipo = evento.target.value;
            dibujarProductos();
        }
    }
});

listaProductos.addEventListener("click", evento => {
    const idEliminar = evento.target.dataset.eliminar;
    if (!idEliminar) return;

    productos = productos.filter(
        p => p.id !== Number(idEliminar)
    );

    dibujarProductos();
});

document.getElementById("btnAgregar").addEventListener("click", nuevoProducto);

document.getElementById("formCotizacion").addEventListener("submit", evento => {
    if (productos.length === 0) {
        evento.preventDefault();
        alert("Agrega al menos un producto.");
        return;
    }

    const invalido = productos.some(producto => {
        if (!producto.producto.trim()) return true;
        if (numeroSeguro(producto.cantidad) <= 0) return true;
        if (numeroSeguro(producto.precio) < 0) return true;

        if (
            (producto.tipo === "metros" || producto.tipo === "kilos") &&
            numeroSeguro(producto.medida) <= 0
        ) {
            return true;
        }

        return false;
    });

    if (invalido) {
        evento.preventDefault();
        alert("Revisa los nombres, cantidades, medidas y precios.");
        return;
    }

    itemsJson.value = JSON.stringify(
        productos.map(({id, ...producto}) => producto)
    );
});

nuevoProducto();
</script>
{% endblock %}
