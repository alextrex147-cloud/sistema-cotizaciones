<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header><h1>PRODUCTOS</h1></header>

<nav>
<a href="{{ url_for('inicio') }}">🏠 Inicio</a>
<a href="{{ url_for('nueva_cotizacion') }}">🧾 Nueva cotización</a>
<a href="{{ url_for('inventario') }}">📦 Inventario</a>
</nav>

<main>

<section class="panel">

<h2>Agregar producto</h2>

<form method="POST" action="{{ url_for('agregar_producto') }}">

<input name="nombre" placeholder="Nombre del producto" required>

<input name="descripcion" placeholder="Descripción">

<select name="tipo_venta" id="tipo">
<option value="unidad">Unidad</option>
<option value="metro">Metro</option>
</select>

<input name="precio" type="number" step="0.01" placeholder="Precio">

<input name="stock" type="number" step="0.01" placeholder="Stock inicial">

<input name="stock_minimo" type="number" step="0.01" placeholder="Stock mínimo">

<input name="largo_inventario" type="number" step="0.01" placeholder="Largo de cada pieza (m)">

<button>Guardar producto</button>

</form>

</section>

<section class="panel">

<h2>Productos</h2>

<table>

<tr>
<th>Producto</th>
<th>Tipo</th>
<th>Stock</th>
<th>Precio</th>
<th>Acción</th>
</tr>

{% for p in productos %}

<tr>

<td>{{ p.nombre }}</td>
<td>{{ p.tipo_venta }}</td>
<td>{{ p.stock }}</td>
<td>{{ "%.2f"|format(p.precio or 0) }} Bs</td>

<td>

<form method="POST" action="{{ url_for('eliminar_producto', id=p.id) }}" onsubmit="return confirm('¿Eliminar producto?');">

<button class="danger">Eliminar</button>

</form>

</td>

</tr>

{% endfor %}

</table>

</section>

</main>

</body>
</html>
