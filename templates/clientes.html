<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header><h1>CLIENTES</h1></header>

<nav>
<a href="{{ url_for('inicio') }}">🏠 Inicio</a>
<a href="{{ url_for('nueva_cotizacion') }}">🧾 Nueva cotización</a>
<a href="{{ url_for('clientes') }}">👥 Clientes</a>
<a href="{{ url_for('productos') }}">📦 Productos</a>
</nav>

<main>

<section class="panel">

<h2>Agregar cliente</h2>

<form method="POST" action="{{ url_for('agregar_cliente') }}">

<input name="nombre" placeholder="Nombre" required>
<input name="telefono" placeholder="Teléfono">
<input name="direccion" placeholder="Dirección">
<input name="email" placeholder="Correo">

<button>Guardar cliente</button>

</form>

</section>

<section class="panel">

<h2>Clientes registrados</h2>

<table>

<tr>
<th>Nombre</th>
<th>Teléfono</th>
<th>Dirección</th>
<th>Acción</th>
</tr>

{% for c in clientes %}

<tr>

<td>{{ c.nombre }}</td>
<td>{{ c.telefono }}</td>
<td>{{ c.direccion }}</td>

<td>

<form method="POST" action="{{ url_for('eliminar_cliente', id=c.id) }}" onsubmit="return confirm('¿Eliminar cliente?');">
<button class="danger">Eliminar</button>
</form>

</td>

</tr>

{% else %}

<tr>
<td colspan="4">No hay clientes.</td>
</tr>

{% endfor %}

</table>

</section>

</main>

</body>
</html>
