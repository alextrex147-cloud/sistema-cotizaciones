<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotizaciones</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
<h1>COTIZACIONES</h1>
</header>

<nav>
<a href="{{ url_for('inicio') }}">🏠 Inicio</a>
<a href="{{ url_for('nueva_cotizacion') }}">➕ Nueva</a>
<a href="{{ url_for('ventas') }}">💰 Ventas</a>
</nav>

<main>

<section class="panel">

<table>

<tr>
<th>Número</th>
<th>Total</th>
<th>Estado</th>
<th>Acciones</th>
</tr>

{% for c in cotizaciones %}

<tr>

<td>{{ c.numero }}</td>

<td>{{ "%.2f"|format(c.total or 0) }} Bs</td>

<td>{{ c.estado }}</td>

<td>

<a class="button" href="{{ url_for('ver_cotizacion', id=c.id) }}">
Ver
</a>

<form method="POST"
      action="{{ url_for('eliminar_cotizacion', id=c.id) }}"
      style="display:inline"
      onsubmit="return confirm('¿Eliminar cotización?');">

<button class="danger">
Eliminar
</button>

</form>

{% if c.estado == "cotizacion" %}

<form method="POST"
      action="{{ url_for('pasar_a_venta', id=c.id) }}"
      style="display:inline">

<select name="forma_pago">

<option>Efectivo</option>
<option>QR</option>
<option>Transferencia</option>
<option>Tarjeta</option>

</select>

<button>
Pasar a venta
</button>

</form>

{% endif %}

</td>

</tr>

{% else %}

<tr>
<td colspan="4">No hay cotizaciones.</td>
</tr>

{% endfor %}

</table>

</section>

</main>

</body>
</html>
